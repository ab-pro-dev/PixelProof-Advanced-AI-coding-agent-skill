[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelproof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jsonschema==4.19.2",
]

[tool.setuptools]
packages = ["pixelproof_image"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
